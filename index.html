<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><meta name="description" content="Missouri State Parks Locator">
<link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>MO Park Locator</title>
<style>
*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#050a12;color:#fff}
#map{z-index:1;background:#0b1118}
#map .leaflet-tile{filter:invert(.88) hue-rotate(180deg) brightness(.78) contrast(1.28) saturate(.72)}
.ui{position:fixed;z-index:1000;top:10px;left:10px;width:min(410px,calc(100% - 20px));background:#08111eeF;border:1px solid #475569;border-radius:16px;padding:13px;box-shadow:0 12px 35px #000b;backdrop-filter:blur(12px)}
h1{font-size:19px;margin:0}.muted{font-size:11px;color:#c3cede}.boot{margin:8px 0;padding:8px;border-radius:9px;background:#152238;font-size:12px}.ok{color:#a8efbd}.warn{color:#ffd27d}
input,button{width:100%;padding:9px;border-radius:9px;border:1px solid #64748b;background:#17263b;color:#fff}button{cursor:pointer}button:hover{background:#22344d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.tools button{font-size:11px;padding:8px}
.search{margin-top:8px}.list{max-height:210px;overflow:auto;margin-top:7px}.item{padding:8px 4px;border-bottom:1px solid #334155;font-size:13px;cursor:pointer}.item small{display:block;color:#b3bfd1;margin-top:2px}
@media(max-width:600px){.ui{top:7px;left:7px;width:calc(100vw - 14px)}.list{max-height:150px}.tools{grid-template-columns:1fr 1fr}}
</style></head>
<body><div id="map"></div>
<section class="ui"><h1>MO Park Locator <span id="mode" class="muted">• starting</span></h1>
<div class="muted">Missouri State Parks • low-signal ready</div><div id="boot" class="boot">Booting map system…</div>
<input id="search" class="search" placeholder="Park, historic site, region…">
<div class="grid"><button id="loc">📍 Location</button><button id="offline">📡 Low-signal</button><button id="parks">Parks ✓</button><button id="trails">DNR trails</button></div>
<div class="tools"><button id="state">State view</button><button id="reload">Refresh</button><button id="infoBtn">Info</button></div>
<div id="list" class="list"></div>
<div class="muted">Park data: Missouri DNR. Trail map: Missouri DNR public trail service. Basemap: OpenStreetMap.</div></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const DB='mo-parks-v3',KEY='parks-v3-data',API='/api/parks';
const DNR_TRAILS='https://gis.dnr.mo.gov/server/rest/services/sphs_trails/SPHS_trails_public/MapServer/tile/{z}/{y}/{x}';
let db,sites=[],parkLayer,trailLayer,low=false,trailLoading=false;
const map=L.map('map',{zoomControl:true,preferCanvas:true,fadeAnimation:false}).setView([38.4561,-92.2884],7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,maxNativeZoom:19,keepBuffer:4,updateWhenIdle:true,updateWhenZooming:false,attribution:'© OpenStreetMap contributors'}).addTo(map);
const $=id=>document.getElementById(id);
function boot(t,c=''){ $('boot').className='boot '+c;$('boot').textContent=t }
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}
function get(k){return new Promise((ok,no)=>{let r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function put(k,v){return new Promise((ok,no)=>{let r=db.transaction('kv','readwrite').objectStore('kv').put(v,k);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
async function start(){boot('Opening local park database…');await openDB();let c=await get(KEY);if(c){sites=c.features||[];draw();render();boot('Cached Missouri park data loaded.','ok')}if(navigator.onLine&&!low)await refresh();else if(!c)boot('Connect once to download the park package.','warn')}
async function refresh(){try{boot('Loading official Missouri park data…');let r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error(r.status);let d=await r.json();sites=d.features||[];await put(KEY,d);draw();render();boot('Ready • '+sites.length+' park/site records cached locally.','ok')}catch(e){boot('Using cached data; live update unavailable.','warn')}}
function draw(){if(parkLayer)map.removeLayer(parkLayer);parkLayer=L.geoJSON({type:'FeatureCollection',features:sites},{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:6,weight:2,fillOpacity:.9}),onEachFeature:(f,l)=>l.on('click',()=>popup(f,l))}).addTo(map)}
function popup(f,l){let p=f.properties||{};l.bindPopup('<b>'+esc(p.LOC_NAME)+'</b><br>'+esc(p.PARK_TYPE||'')+'<br>Region: '+esc(p.REGION||'')+'<br>Approx. acres: '+esc(p.GIS_ACRES??'—')+(p.URL?'<br><a target="_blank" rel="noopener" href="'+esc(p.URL)+'">Official park page</a>':'')).openPopup()}
function render(){let q=$('search').value.toLowerCase().trim(),el=$('list');el.innerHTML='';sites.filter(f=>{let p=f.properties||{};return !q||[p.LOC_NAME,p.SHORT_NAME,p.REGION,p.PARK_TYPE].join(' ').toLowerCase().includes(q)}).slice(0,200).forEach(f=>{let p=f.properties||{},d=document.createElement('div');d.className='item';d.innerHTML=esc(p.LOC_NAME||p.SHORT_NAME)+'<small>'+esc(p.PARK_TYPE||'')+' • '+esc(p.REGION||'')+'</small>';d.onclick=()=>{let c=f.geometry.coordinates;map.setView([c[1],c[0]],14);let m=L.marker([c[1],c[0]]).addTo(map);popup(f,m);setTimeout(()=>map.removeLayer(m),15000)};el.appendChild(d)})}
$('search').oninput=render;
$('parks').onclick=()=>{if(map.hasLayer(parkLayer)){map.removeLayer(parkLayer);$('parks').textContent='Parks'}else{parkLayer.addTo(map);$('parks').textContent='Parks ✓'}};
function enableTrails(){
  if(trailLayer||trailLoading)return;
  trailLoading=true;$('trails').textContent='Loading trails…';boot('Loading official DNR trail map…');
  const layer=L.tileLayer(DNR_TRAILS,{opacity:.98,minZoom:6,maxZoom:19,maxNativeZoom:19,keepBuffer:6,updateWhenIdle:true,updateWhenZooming:false,detectRetina:false,attribution:'Missouri DNR public trails map'});
  let errors=0;
  layer.on('tileerror',()=>{errors++;if(errors>=3)boot('Some DNR trail tiles are unavailable; map remains usable.','warn')});
  layer.on('load',()=>{trailLoading=false;trailLayer=layer;$('trails').textContent='DNR trails ✓';boot('Official DNR trail map enabled.','ok');layer.bringToFront()});
  layer.addTo(map);
  setTimeout(()=>{if(trailLoading){trailLoading=false;trailLayer=layer;$('trails').textContent='DNR trails ✓';boot('Trail layer enabled; unavailable tiles will retry as you move.','warn');layer.bringToFront()}},8000);
}
$('trails').onclick=()=>{if(trailLayer){map.removeLayer(trailLayer);trailLayer=null;$('trails').textContent='DNR trails';boot('DNR trail map hidden.','ok');return}enableTrails()};
$('loc').onclick=()=>map.locate({setView:true,maxZoom:15,enableHighAccuracy:true});
map.on('locationfound',e=>L.circleMarker(e.latlng,{radius:8,weight:2}).addTo(map).bindPopup('Your location').openPopup());
map.on('locationerror',()=>boot('Location unavailable; map still works.','warn'));
$('offline').onclick=()=>{low=!low;$('mode').textContent=low?'• low-signal':'• online';boot(low?'Low-signal mode: cached data preferred.':'Online mode: live refresh allowed.',low?'warn':'ok')};
$('reload').onclick=refresh;
$('state').onclick=()=>map.setView([38.4561,-92.2884],7);
$('infoBtn').onclick=()=>boot('Dark high-contrast map uses OpenStreetMap tiles and requires no API key. Trail data comes from the official Missouri DNR public trail map.','ok');
window.addEventListener('online',()=>{if(!low)refresh()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});start();
</script></body></html>
